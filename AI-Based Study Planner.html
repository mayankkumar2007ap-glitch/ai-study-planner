<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap">
<style>
:root{--bg:#f6f7fd;--card:#fff;--ink:#1b1d3a;--mute:#6b6f8f;--line:#e5e7f5;--a:#4f46e5;--a2:#7c3aed;--ok:#16a34a;--warn:#ea580c;--sh:0 6px 24px rgba(79,70,229,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12132a;--card:#1c1e3c;--ink:#eceefe;--mute:#9a9ec6;--line:#2c2f58;--sh:none}}
:root[data-theme=dark]{--bg:#12132a;--card:#1c1e3c;--ink:#eceefe;--mute:#9a9ec6;--line:#2c2f58;--sh:none}
html{scroll-padding-top:70px}*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Plus Jakarta Sans',system-ui,Segoe UI,sans-serif}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}h1{font-size:clamp(2rem,5vw,3.4rem);font-weight:800}h2{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800}h3{font-size:1.05rem}p{margin:0 0 .8em}
a{color:var(--a)}button,input,select{font:inherit}
.btn{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border:0;border-radius:12px;padding:11px 20px;font-weight:600;cursor:pointer;min-height:44px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn.ghost{background:var(--card);color:var(--a);border:1px solid var(--line)}.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}.btn.red{background:#dc2626}
:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;padding:10px 5vw;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav.top b{font-size:1.1rem;margin-right:auto;cursor:pointer}nav.top a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--ink);cursor:pointer;font-weight:500}nav.top a:hover{background:var(--bg)}
#menu{display:none}
section.s{padding:64px 5vw;max-width:1150px;margin:auto}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--sh);transition:transform .2s}.grid>.card:hover{transform:translateY(-3px)}
.ico{font-size:1.6rem;display:block;margin-bottom:6px}
.badge{display:inline-block;background:rgba(124,58,237,.12);color:var(--a2);padding:5px 12px;border-radius:99px;font-weight:600;font-size:13px;margin-bottom:14px}
.hero{display:grid;gap:30px;grid-template-columns:1.1fr .9fr;align-items:center}.hero p{color:var(--mute);font-size:1.1rem}
.mute{color:var(--mute)}.center{text-align:center}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}.flow .card{padding:12px 16px;font-weight:600;opacity:0;transform:translateY(14px);transition:.5s}.flow.in .card{opacity:1;transform:none}.flow i{color:var(--a);font-style:normal;animation:nudge 1.4s infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}ul.tick{padding-left:18px;margin:0}
.dbt{font-size:13px}.dbt b{display:block;color:var(--a);margin-bottom:4px}.fk{color:var(--a2)}
.auth{max-width:400px;margin:40px auto;padding:0 16px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px}
.err{color:#dc2626;font-size:12px;min-height:1em}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
aside a{display:block;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink);cursor:pointer;margin-bottom:2px}aside a:hover{background:var(--bg)}aside a.on{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff}
main{padding:24px 4vw;min-width:0}.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--a2));border-radius:9px;transition:width .6s}
.stat{font-size:1.8rem;font-weight:800}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.tl{border-left:4px solid var(--a);padding:10px 14px;margin-bottom:10px;background:var(--card);border-radius:0 12px 12px 0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.empty{text-align:center;padding:30px;color:var(--mute);border:2px dashed var(--line);border-radius:16px}
.days{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.ai{border:1px solid var(--a2);background:linear-gradient(135deg,rgba(79,70,229,.08),rgba(124,58,237,.08))}
dialog{border:0;border-radius:18px;padding:22px;width:min(440px,92vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(10,10,30,.5)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:50;display:grid;gap:8px}
#toast div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;animation:pop .3s}@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--a);border-radius:50%;animation:rot .7s linear infinite;vertical-align:middle}@keyframes rot{to{transform:rotate(360deg)}}
.sw{width:44px;height:24px;accent-color:var(--a)}
@media(max-width:860px){.hero,.two{grid-template-columns:1fr}.app{grid-template-columns:1fr}
aside{position:fixed;z-index:30;width:240px;left:-260px;transition:left .25s;top:0}aside.open{left:0}#menu{display:inline-block}
nav.top a.hide{display:none}nav.top.open a.hide{display:block}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.flow .card{opacity:1;transform:none}}
</style></head><body>
<div id="root"></div><div id="toast"></div><dialog id="dlg"></dialog>
<script>
/* ===== Storage layer: swap these two functions for REST/JDBC calls later ===== */
const Store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
/* ===== Helpers ===== */
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayStr=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const daysLeft=s=>Math.ceil((new Date(s+'T00:00')-new Date(new Date().toDateString()))/864e5);
const fmt=s=>new Date(s+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const pct=s=>s.topics?Math.round(s.done/s.topics*100):0;
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),2600)}
/* ===== State ===== */
const seed=()=>({subjects:[
 {id:'s1',name:'Data Structures',difficulty:'High',priority:3,exam:dayStr(12),topics:12,done:9},
 {id:'s2',name:'Java OOP',difficulty:'Medium',priority:2,exam:dayStr(17),topics:10,done:6},
 {id:'s3',name:'Operating Systems',difficulty:'High',priority:3,exam:dayStr(22),topics:11,done:5}],
 tasks:[{id:'t1',title:'Linked list practice set',subjectId:'s1',deadline:dayStr(2),done:false},
 {id:'t2',title:'Java assignment',subjectId:'s2',deadline:dayStr(1),done:false},
 {id:'t3',title:'OS process scheduling notes',subjectId:'s3',deadline:dayStr(4),done:true}],
 plan:null,hours:4,rem:{session:true,assign:true,exam:true},log:[3,4.5,2,5,4,6,0],theme:''});
let S=Store.get('asp_data',null)||seed();
const save=()=>Store.set('asp_data',S);
let user=Store.get('asp_user',null);
/* ===== Rule-based planner (swap for AI API later) ===== */
const Planner={
  W:{Low:1,Medium:1.6,High:2.4},times:['09:00','10:30','14:00','17:00','19:00','20:30','22:00'],
  generate(boost){
    const subs=S.subjects.filter(s=>daysLeft(s.exam)>=0);if(!subs.length)return null;
    const plan=[];const n=Math.min(7,Math.max(1,Math.floor(S.hours)));
    for(let d=0;d<7;d++){const cnt={};const items=[];
      for(let b=0;b<n;b++){
        let best=null,bs=-1;
        subs.forEach(s=>{const urg=1+10/(Math.max(daysLeft(s.exam)-d,0)+1);
          let sc=this.W[s.difficulty]*s.priority*(1.2-pct(s)/100)*urg*(boost===s.id?1.6:1)/(1+(cnt[s.id]||0));
          if(sc>bs){bs=sc;best=s}});
        cnt[best.id]=(cnt[best.id]||0)+1;
        items.push({time:this.times[b],subjectId:best.id,done:false});}
      plan.push({date:dayStr(d),items});}
    return plan;}
};
/* ===== AI service: returns text; replace body with fetch() to a real API ===== */
const AI={
  async recommend(kind){await new Promise(r=>setTimeout(r,700));const out=[];
    const subs=S.subjects.filter(s=>daysLeft(s.exam)>=0).sort((a,b)=>daysLeft(a.exam)-daysLeft(b.exam));
    if(!subs.length)return['Add a subject with an exam date and I can start suggesting study sessions.'];
    const near=subs[0],weak=[...subs].sort((a,b)=>pct(a)-pct(b))[0];
    if(kind!=='schedule'){
      out.push(`You have an upcoming ${near.name} exam in ${daysLeft(near.exam)} days. Consider spending an extra 45 minutes today on its unfinished topics (${near.topics-near.done} left).`);
      if(weak.id!==near.id||pct(weak)<60)out.push(`Your progress in ${weak.name} (${pct(weak)}%) is lower than your other subjects. Consider increasing its priority.`);}
    if(kind==='progress'){const all=S.subjects.reduce((a,s)=>a+s.done,0),tot=S.subjects.reduce((a,s)=>a+s.topics,0);
      out.push(`Overall you have covered ${all} of ${tot} topics (${tot?Math.round(all/tot*100):0}%). ${S.tasks.filter(t=>!t.done).length} tasks are still open.`);}
    if(kind==='schedule'){S.plan=Planner.generate(weak.id);save();out.push(`I rebalanced your 7-day plan to give ${weak.name} more sessions. Open the Planner to review it.`);}
    if(kind==='rec'){out.push(`You have ${S.hours} hours available per day. A revision session followed by practice questions is recommended.`);}
    const due=S.tasks.filter(t=>!t.done&&daysLeft(t.deadline)<=1)[0];
    if(due)out.push(`"${due.title}" is due ${daysLeft(due.deadline)<=0?'today':'tomorrow'}. Finish it before starting new topics.`);
    return out;}
};
/* ===== Modal form + confirm ===== */
function form(title,fields,vals,onSave){
  const d=$('#dlg');
  d.innerHTML=`<h3>${title}</h3><form id="f" novalidate>${fields.map(f=>`<label for="f_${f.k}">${f.label}</label>${f.opts?`<select id="f_${f.k}">${f.opts.map(o=>`<option value="${o[0]}" ${String(o[0])===String(vals[f.k])?'selected':''}>${o[1]}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(vals[f.k]??'')}" ${f.min!=null?`min="${f.min}"`:''}>`}<div class="err" id="e_${f.k}"></div>`).join('')}
  <div class="row" style="margin-top:14px"><button class="btn">Save</button><button type="button" class="btn ghost" id="cx">Cancel</button></div></form>`;
  d.showModal();$('#cx').onclick=()=>d.close();
  $('#f').onsubmit=e=>{e.preventDefault();let ok=true;const out={};
    fields.forEach(f=>{const v=$('#f_'+f.k).value.trim();let m='';
      if(!v)m='Required';else if(f.t==='number'&&(isNaN(v)||+v<(f.min??0)))m=`Enter a number ≥ ${f.min??0}`;
      $('#e_'+f.k).textContent=m;if(m)ok=false;out[f.k]=f.t==='number'?+v:v});
    if(ok&&out.done>out.topics){$('#e_done').textContent='Cannot exceed total topics';ok=false}
    if(ok){d.close();onSave(out)}}}
function confirmBox(msg,yes){const d=$('#dlg');d.innerHTML=`<h3>Are you sure?</h3><p>${msg}</p><div class="row"><button class="btn red" id="y">Delete</button><button class="btn ghost" id="n">Cancel</button></div>`;d.showModal();$('#n').onclick=()=>d.close();$('#y').onclick=()=>{d.close();yes()}}
/* ===== Views ===== */
const nav=(items,cur)=>items.map(i=>`<a data-act="go" data-to="${i[0]}" class="${cur===i[0]?'on':''}">${i[1]}</a>`).join('');
const APPNAV=[['dashboard','🏠 Dashboard'],['subjects','📚 Subjects'],['planner','🗓️ Planner'],['tasks','✅ Tasks'],['exams','⏳ Exams'],['progress','📊 Progress'],['ai','✨ AI Assistant'],['settings','⚙️ Settings']];
const cards=(arr,cls='')=>`<div class="grid ${cls}">${arr.map(c=>`<div class="card"><span class="ico">${c[0]}</span><h3>${c[1]}</h3>${c[2]?`<p class="mute" style="margin:0">${c[2]}</p>`:''}</div>`).join('')}</div>`;
function landing(){return `
<nav class="top" id="tnav"><b data-act="go" data-to="home">🎓 AI Study Planner</b><button class="btn ghost sm" id="menu" data-act="tmenu" aria-label="Menu">☰</button>
<a class="hide" data-act="sc" data-to="home">Home</a><a class="hide" data-act="sc" data-to="features">Features</a><a class="hide" data-act="sc" data-to="how">How It Works</a><a class="hide" data-act="sc" data-to="tech">Technology</a><a class="hide" data-act="go" data-to="${user?'app/dashboard':'login'}">Dashboard</a>
${user?'<a class="hide" data-act="logout">Logout</a>':'<a class="hide" data-act="go" data-to="login">Login</a>'}</nav>
<section class="s" id="home"><div class="hero"><div><span class="badge">✨ AI-Powered Student Productivity</span><h1>Plan Smarter. Study Better.</h1>
<p>AI-Based Study Planner that creates personalized study schedules based on your subjects, exams, available time, and study progress.</p>
<div class="row"><button class="btn" data-act="go" data-to="${user?'app/dashboard':'register'}">Get Started</button><button class="btn ghost" data-act="sc" data-to="features">Explore Features</button></div></div>
<svg viewBox="0 0 400 300" role="img" aria-label="Student with laptop, calendar, chart and books"><rect x="40" y="60" width="240" height="150" rx="14" fill="var(--card)" stroke="var(--a)" stroke-width="3"/><rect x="56" y="76" width="90" height="60" rx="8" fill="rgba(79,70,229,.15)"/><g fill="var(--a)"><rect x="66" y="112" width="12" height="16"/><rect x="84" y="100" width="12" height="28"/><rect x="102" y="90" width="12" height="38"/><rect x="120" y="106" width="12" height="22"/></g><rect x="158" y="76" width="106" height="14" rx="5" fill="var(--a2)"/><rect x="158" y="98" width="80" height="10" rx="5" fill="var(--line)"/><rect x="158" y="116" width="92" height="10" rx="5" fill="var(--line)"/><rect x="56" y="148" width="208" height="10" rx="5" fill="var(--line)"/><rect x="56" y="168" width="140" height="10" rx="5" fill="var(--line)"/><path d="M20 226h280l-24-16H44z" fill="var(--a2)" opacity=".5"/><rect x="290" y="50" width="86" height="90" rx="12" fill="var(--card)" stroke="var(--a2)" stroke-width="3"/><rect x="290" y="50" width="86" height="22" rx="12" fill="var(--a2)"/><g fill="var(--a)" opacity=".7"><circle cx="308" cy="92" r="5"/><circle cx="333" cy="92" r="5"/><circle cx="358" cy="92" r="5"/><circle cx="308" cy="114" r="5"/><circle cx="333" cy="114" r="5"/></g><rect x="300" y="232" width="80" height="14" rx="3" fill="var(--a)"/><rect x="306" y="216" width="70" height="16" rx="3" fill="var(--a2)"/><rect x="296" y="200" width="76" height="16" rx="3" fill="#0ea5e9"/><text x="305" y="278" font-size="13" fill="var(--mute)">AI ✨ plans your week</text><circle cx="350" cy="170" r="22" fill="var(--a2)"/><text x="336" y="176" font-size="16" fill="#fff" font-weight="700">AI</text></svg></div></section>
<section class="s"><h2 class="center">The Problem</h2><div class="card ai center" style="margin-bottom:16px"><p style="margin:0">Students often struggle to manage multiple subjects, assignments, and exams effectively. The AI-Based Study Planner creates a personalized study schedule based on subjects, deadlines, available time, and progress.</p></div>
${cards([['📚','Too many subjects'],['⏰','Poor time management'],['📝','Multiple assignments'],['📅','Exam deadlines'],['📊','Difficult to track progress']])}</section>
<section class="s"><h2 class="center">Our Objective</h2>${cards([['🎯','Personalized Planning','Create study schedules according to individual student requirements.'],['⏱️','Time Management','Help students use their available study hours effectively.'],['🧭','Smart Prioritization','Prioritize subjects based on difficulty and exam deadlines.'],['📈','Progress Tracking','Track completed tasks and overall study progress.'],['🤖','AI Recommendations','Provide smart recommendations based on student data and progress.']])}</section>
<section class="s" id="features"><h2 class="center">Key Features</h2>${cards([['🔐','User Registration & Login','Create an account and keep your data private.'],['📚','Subject & Exam Management','Add subjects, topics, difficulty and exam dates.'],['🗓️','Personalized Study Schedule','A 7-day timetable built from your data.'],['✨','AI Study Recommendations','Smart tips based on progress and deadlines.'],['✅','Task Management','Add, edit and complete assignments.'],['📈','Progress Tracking','See topics covered per subject.'],['⏳','Exam Countdown','Days remaining for every exam.'],['🔔','Reminders & Notifications','Switch reminder types on or off.'],['📊','Progress Dashboard','Charts, streaks and weekly summary.']])}</section>
<section class="s" id="how"><h2 class="center">How the System Works</h2><div class="flow" id="flow">${['Student Input','Subject & Exam Details','Available Study Hours','Difficulty & Priority','AI Study Planner','Personalized Schedule','Progress Tracking & Recommendations'].map((t,i)=>(i?'<i>➜</i>':'')+`<div class="card" style="transition-delay:${i*.15}s">${t}</div>`).join('')}</div></section>
<section class="s"><h2 class="center">Input & Output</h2><div class="flow" style="margin-bottom:20px"><div class="card">INPUT</div><i>➜</i><div class="card ai">🤖 AI STUDY PLANNER</div><i>➜</i><div class="card">OUTPUT</div></div>
<div class="two"><div class="card"><h3>Expected Input</h3><ul class="tick">${['Student details','Login information','Subjects and topics','Exam dates','Assignment deadlines','Available study hours','Subject difficulty','Subject priority','Study progress','Completed tasks'].map(x=>`<li>${x}</li>`).join('')}</ul></div>
<div class="card"><h3>Expected Output</h3><ul class="tick">${['Personalized study timetable','Subject-wise schedule','AI study recommendations','Task list','Progress tracking','Exam countdown','Reminders and notifications','Progress reports'].map(x=>`<li>${x}</li>`).join('')}</ul></div></div></section>
<section class="s" id="tech"><h2 class="center">Technology</h2><div class="grid">
${[['Programming Paradigms',['Object-Oriented Programming','Procedural Programming','Event-Driven Programming','AI/Rule-Based Programming']],['Java Concepts',['Classes & Objects','Inheritance','Encapsulation','Polymorphism','Collections','Exception Handling','File Handling','Multithreading']],['Technologies',['Java','JavaFX / Swing','JDBC','MySQL','REST API','AI API']]].map(g=>`<div class="card"><h3>${g[0]}</h3><div class="row">${g[1].map(x=>`<span class="tag">${x}</span>`).join('')}</div></div>`).join('')}</div>
<p class="mute center" style="margin-top:14px">This prototype uses HTML/JS + localStorage. The Store, Planner and AI objects in the code are the layers to replace with Java + MySQL REST calls.</p></section>
<section class="s"><h2 class="center">Database Structure</h2><div class="grid">
${[['Users',['user_id (PK)','name','email','password']],['Subjects',['subject_id (PK)','subject_name','difficulty','priority']],['Exams',['exam_id (PK)','subject_id (FK → Subjects)','exam_date']],['Tasks',['task_id (PK)','subject_id (FK → Subjects)','task_name','deadline','status']],['Study Sessions',['session_id (PK)','subject_id (FK → Subjects)','date','duration']]].map(t=>`<div class="card dbt"><b>${t[0]}</b>${t[1].map(c=>`<div class="${c.includes('FK')?'fk':''}">${c}</div>`).join('')}</div>`).join('')}</div>
<p class="mute center" style="margin-top:14px">Subjects (1) ➜ (many) Exams, Tasks and Study Sessions</p></section>
<footer class="center mute" style="padding:30px">AI-Based Study Planner · 2nd-year BTech CSE project</footer>`}

function authView(reg){return `<nav class="top"><b data-act="go" data-to="home">🎓 AI Study Planner</b><a data-act="go" data-to="home">Home</a></nav>
<div class="auth"><div class="card"><h2>${reg?'Create account':'Welcome back'}</h2><p class="mute">${reg?'Start planning your study week.':'Log in to open your dashboard.'}</p>
<form id="auth" novalidate>${reg?'<label for="a_name">Name</label><input id="a_name"><div class="err" id="e_name"></div>':''}
<label for="a_email">Email</label><input id="a_email" type="email"><div class="err" id="e_email"></div>
<label for="a_pw">Password</label><input id="a_pw" type="password"><div class="err" id="e_pw"></div>
${reg?'<label for="a_pw2">Confirm password</label><input id="a_pw2" type="password"><div class="err" id="e_pw2"></div>':''}
<div class="err" id="e_form"></div><button class="btn" style="width:100%;margin-top:8px">${reg?'Create Account':'Login'}</button></form>
<p style="margin-top:14px" class="center">${reg?'Already registered? <a data-act="go" data-to="login" href="#/login">Login</a>':'<a href="#/login" data-act="forgot">Forgot Password?</a><br>Don\'t have an account? <a data-act="go" data-to="register" href="#/register">Create Account</a>'}</p>
<p class="mute center" style="font-size:12px">Demo only: data is stored in this browser.</p></div></div>`}

function dashboard(){
  const plan=S.plan?.[0],up=[...S.subjects].filter(s=>daysLeft(s.exam)>=0).sort((a,b)=>daysLeft(a.exam)-daysLeft(b.exam))[0];
  const done=S.tasks.filter(t=>t.done).length,tot=S.subjects.reduce((a,s)=>a+s.topics,0),dn=S.subjects.reduce((a,s)=>a+s.done,0);
  return `<h2>Dashboard</h2><div class="grid" style="margin-bottom:20px">
<div class="card"><span class="mute">Today's Study Hours</span><div class="stat">${todayHours()} hrs</div></div>
<div class="card"><span class="mute">Tasks Completed</span><div class="stat">${done}/${S.tasks.length}</div></div>
<div class="card"><span class="mute">Upcoming Exam</span><div class="stat" style="font-size:1.1rem">${up?`${esc(up.name)} — ${daysLeft(up.exam)} Days`:'None'}</div></div>
<div class="card"><span class="mute">Overall Progress</span><div class="stat">${tot?Math.round(dn/tot*100):0}%</div></div></div>
<h3>Today's Schedule</h3>${plan?plan.items.map((it,i)=>tlItem(0,i,it)).join(''):`<div class="empty">No plan yet.<br><br><button class="btn" data-act="gen">Generate Study Plan</button></div>`}`}
const subName=id=>esc(S.subjects.find(s=>s.id===id)?.name||'Deleted subject');
const endT=t=>{const[h,m]=t.split(':').map(Number);return String(h+1).padStart(2,'0')+':'+String(m).padStart(2,'0')};
const tlItem=(d,i,it)=>`<div class="tl"><span><b>${it.time} – ${endT(it.time)}</b> → ${subName(it.subjectId)}</span><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:20px;min-height:20px" data-act="sess" data-d="${d}" data-i="${i}" ${it.done?'checked':''}> Done</label></div>`;
const todayHours=()=>(S.plan?.[0]?.items.filter(i=>i.done).length||0)+S.log[6];
const weekLog=()=>{const l=[...S.log];l[6]=todayHours();return l};

function subjects(){return `<div class="row sp"><h2>My Subjects</h2><button class="btn" data-act="addsub">Add Subject</button></div>
${S.subjects.length?`<div class="grid">${S.subjects.map(s=>`<div class="card"><h3>${esc(s.name)}</h3><div class="bar"><i style="width:${pct(s)}%"></i></div>
<p class="mute" style="margin:8px 0">Progress: ${pct(s)}% · Difficulty: ${s.difficulty} · Priority: ${s.priority}<br>Exam: ${fmt(s.exam)} · Topics: ${s.topics} · Completed: ${s.done}</p>
<div class="row"><button class="btn sm ghost" data-act="editsub" data-id="${s.id}">Edit</button><button class="btn sm ghost" data-act="topic" data-id="${s.id}">+1 topic done</button><button class="btn sm ghost" data-act="go" data-to="app/progress">View Progress</button><button class="btn sm red" data-act="delsub" data-id="${s.id}">Delete</button></div></div>`).join('')}</div>`:'<div class="empty">No subjects yet. Add your first subject to get started.</div>'}`}
const subFields=[{k:'name',label:'Subject name'},{k:'difficulty',label:'Difficulty',opts:[['Low','Low'],['Medium','Medium'],['High','High']]},{k:'priority',label:'Priority',opts:[[1,'1 – Low'],[2,'2 – Medium'],[3,'3 – High']]},{k:'exam',label:'Exam date',t:'date'},{k:'topics',label:'Total topics',t:'number',min:1},{k:'done',label:'Topics completed',t:'number',min:0}];

function planner(){
  return `<div class="row sp"><h2>Study Planner</h2><div class="row"><button class="btn" data-act="gen">${S.plan?'Regenerate Plan':'Generate Study Plan'}</button><button class="btn ghost" data-act="addtask">Add Task</button></div></div>
<div class="card" style="margin-bottom:16px"><div class="row"><label for="hrs" style="margin:0">Available study hours per day</label><input id="hrs" type="number" min="1" max="7" value="${S.hours}" style="width:90px" data-act="hrs"></div>
<p class="mute" style="margin:8px 0 0">Add subjects, topics, exam dates, difficulty and priority on the Subjects page, then generate your plan.</p></div>
${S.plan?`<div class="days">${S.plan.map((d,di)=>`<div class="card"><h3>${new Date(d.date+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}</h3>${d.items.map((it,i)=>`<div style="margin-bottom:8px"><span class="tag">${it.time}</span> ${subName(it.subjectId)} <input type="checkbox" style="width:18px;min-height:18px;vertical-align:middle" data-act="sess" data-d="${di}" data-i="${i}" ${it.done?'checked':''} aria-label="Mark done"></div>`).join('')}</div>`).join('')}</div>`:'<div class="empty">Your timetable will appear here.</div>'}
<h3 style="margin-top:22px">Tasks</h3>${taskList()}`}
function taskList(){return S.tasks.length?S.tasks.map(t=>`<div class="tl" style="opacity:${t.done?.6:1}"><span><input type="checkbox" style="width:20px;min-height:20px;vertical-align:middle" data-act="tdone" data-id="${t.id}" ${t.done?'checked':''} aria-label="Completed"> <b style="${t.done?'text-decoration:line-through':''}">${esc(t.title)}</b> <span class="tag">${subName(t.subjectId)}</span> <span class="tag">Due ${fmt(t.deadline)}</span></span><span class="row"><button class="btn sm ghost" data-act="edittask" data-id="${t.id}">Edit</button><button class="btn sm red" data-act="deltask" data-id="${t.id}">Delete</button></span></div>`).join(''):'<div class="empty">No tasks. Add one to start tracking.</div>'}
const tasksView=()=>`<div class="row sp"><h2>Tasks</h2><button class="btn" data-act="addtask">Add Task</button></div>${taskList()}`;
const taskFields=()=>[{k:'title',label:'Task name'},{k:'subjectId',label:'Subject',opts:S.subjects.map(s=>[s.id,esc(s.name)])},{k:'deadline',label:'Deadline',t:'date'}];

function exams(){const l=[...S.subjects].sort((a,b)=>daysLeft(a.exam)-daysLeft(b.exam));
  return `<h2>Upcoming Exams</h2>${l.length?`<div class="grid">${l.map(s=>{const d=daysLeft(s.exam);return `<div class="card"><h3>${esc(s.name)}</h3><p style="margin:0">📅 ${fmt(s.exam)}</p><div class="stat" style="color:${d<=7?'var(--warn)':'var(--a)'}">⏳ ${d<0?'Completed':d+' Days'}</div><span class="mute">${d<0?'Exam date has passed':'Remaining'}</span></div>`}).join('')}</div>`:'<div class="empty">No exams scheduled. Add a subject with an exam date.</div>'}`}

function progress(){const w=weekLog(),mx=Math.max(...w,1),tot=w.reduce((a,b)=>a+b,0),dn=S.tasks.filter(t=>t.done).length,all=S.tasks.length;
  const dl=[...Array(7)].map((_,i)=>new Date(Date.now()-(6-i)*864e5).toLocaleDateString('en-IN',{weekday:'short'}));
  const tp=all?Math.round(dn/all*100):0,tt=S.subjects.reduce((a,s)=>a+s.topics,0),td=S.subjects.reduce((a,s)=>a+s.done,0),perf=tt?Math.round(td/tt*100):0;
  return `<h2>Progress</h2><div class="grid" style="margin-bottom:16px"><div class="card"><span class="mute">Study Streak</span><div class="stat">🔥 7 Days</div></div><div class="card"><span class="mute">Overall Performance</span><div class="stat">${perf}%</div></div><div class="card"><span class="mute">Tasks Completed</span><div class="stat">${tp}%</div></div></div>
<div class="two"><div class="card"><h3>Weekly Study Hours</h3><svg viewBox="0 0 280 150" style="width:100%" role="img" aria-label="Weekly study hours bar chart">${w.map((h,i)=>{const bh=h/mx*100;return `<rect x="${i*40+8}" y="${115-bh}" width="26" height="${bh}" rx="6" fill="var(--a)"/><text x="${i*40+21}" y="${110-bh}" font-size="10" text-anchor="middle" fill="var(--ink)">${h}</text><text x="${i*40+21}" y="135" font-size="10" text-anchor="middle" fill="var(--mute)">${dl[i]}</text>`}).join('')}</svg>
<p class="mute" style="margin:0"><b>Total Study Time:</b> ${tot} hours · <b>Tasks Completed:</b> ${dn} · <b>Tasks Remaining:</b> ${all-dn}</p></div>
<div class="card"><h3>Subject Progress</h3>${S.subjects.map(s=>`<div style="margin-bottom:12px"><div class="row sp"><span>${esc(s.name)}</span><b>${pct(s)}%</b></div><div class="bar"><i style="width:${pct(s)}%"></i></div></div>`).join('')||'<div class="empty">No subjects</div>'}</div></div>`}

let aiOut=null;
function aiView(){return `<h2>AI Study Assistant</h2><div class="row" style="margin-bottom:16px"><button class="btn" data-act="ai" data-k="rec">Generate Recommendation</button><button class="btn ghost" data-act="ai" data-k="schedule">Improve My Schedule</button><button class="btn ghost" data-act="ai" data-k="progress">Analyze My Progress</button></div>
<div id="aiout">${aiOut?aiCards(aiOut):'<div class="empty">Choose an action above to get AI-generated recommendations.</div>'}</div>`}
const aiCards=a=>a.map(t=>`<div class="card ai" style="margin-bottom:12px"><span class="badge">✨ AI-generated</span><p style="margin:0">${esc(t)}</p></div>`).join('');

function settings(){const r=S.rem;
  const rows=[['session','Study session reminders','🔔 Study session starts in 15 minutes.'],['assign','Assignment deadline reminders','🔔 Assignments due soon'],['exam','Exam reminders','🔔 Exams approaching']];
  const live=[];const up=[...S.subjects].filter(s=>daysLeft(s.exam)>=0).sort((a,b)=>daysLeft(a.exam)-daysLeft(b.exam))[0];
  if(r.session&&S.plan)live.push(`🔔 Study session starts in 15 minutes: ${subName(S.plan[0].items[0]?.subjectId)}`);
  if(r.assign)S.tasks.filter(t=>!t.done&&daysLeft(t.deadline)<=2).forEach(t=>live.push(`🔔 ${esc(t.title)} due ${daysLeft(t.deadline)<=0?'today':daysLeft(t.deadline)===1?'tomorrow':'in 2 days'}`));
  if(r.exam&&up)live.push(`🔔 ${esc(up.name)} exam in ${daysLeft(up.exam)} days`);
  return `<h2>Settings & Reminders</h2><div class="two"><div class="card"><h3>Reminders</h3>${rows.map(x=>`<div class="row sp" style="margin-bottom:10px"><label style="margin:0" for="r_${x[0]}">${x[1]}</label><input class="sw" type="checkbox" id="r_${x[0]}" data-act="rem" data-k="${x[0]}" ${r[x[0]]?'checked':''}></div>`).join('')}
<h3 style="margin-top:18px">Account</h3><p class="mute">${esc(user?.name)} · ${esc(user?.email)}</p><div class="row"><button class="btn ghost sm" data-act="theme">Toggle theme</button><button class="btn red sm" data-act="reset">Reset demo data</button></div></div>
<div class="card"><h3>Notifications</h3>${live.length?live.map(l=>`<div class="tl">${l}</div>`).join(''):'<div class="empty">No active reminders.</div>'}</div></div>`}

const VIEWS={dashboard,subjects,planner,tasks:tasksView,exams,progress,ai:aiView,settings};
function appShell(v){return `<div class="app"><aside id="side"><b style="display:block;padding:8px 12px 16px;font-size:1.1rem">🎓 AI Study Planner</b>${nav(APPNAV.map(a=>[a[0]==='dashboard'?'app/dashboard':'app/'+a[0],a[1]]),'app/'+v)}<a data-act="go" data-to="home">🌐 Website</a><a data-act="logout">🚪 Logout</a></aside>
<div><div class="top nav" style="display:none"></div><div class="row" style="padding:10px 4vw;border-bottom:1px solid var(--line);background:var(--card)"><button class="btn ghost sm" id="menu" data-act="sidemenu" aria-label="Open menu">☰</button><span class="mute">Hi, ${esc(user.name.split(' ')[0])} 👋</span></div><main>${VIEWS[v]()}</main></div></div>`}

/* ===== Router ===== */
function render(){
  const h=location.hash.replace(/^#\/?/,'')||'home';let html;
  if(h.startsWith('app/')){if(!user){location.hash='#/login';return}const v=h.slice(4);html=appShell(VIEWS[v]?v:'dashboard')}
  else if(h==='login')html=authView(false);else if(h==='register')html=authView(true);else html=landing();
  $('#root').innerHTML=html;window.scrollTo(0,0);
  const f=$('#flow');if(f){new IntersectionObserver((e,o)=>e.forEach(x=>{if(x.isIntersecting){f.classList.add('in');o.disconnect()}})).observe(f)}
  const a=$('#auth');if(a)a.onsubmit=doAuth;
}
addEventListener('hashchange',render);
const go=to=>{const t='#/'+(to==='home'?'':to);if(location.hash===t||(!location.hash&&to==='home'))render();else location.hash=t};
/* ===== Auth ===== */
function doAuth(e){e.preventDefault();const reg=!!$('#a_name'),v=id=>$(id)?.value.trim()||'',err={};
  const em=v('#a_email'),pw=v('#a_pw'),users=Store.get('asp_users',[]);
  if(reg&&!v('#a_name'))err.name='Enter your name';
  if(!/^\S+@\S+\.\S+$/.test(em))err.email='Enter a valid email';
  if(pw.length<6)err.pw='Use at least 6 characters';
  if(reg&&pw!==v('#a_pw2'))err.pw2='Passwords do not match';
  ['name','email','pw','pw2','form'].forEach(k=>{const n=$('#e_'+k);if(n)n.textContent=err[k]||''});
  if(Object.keys(err).length)return;
  if(reg){if(users.some(u=>u.email===em)){$('#e_email').textContent='This email is already registered';return}
    users.push({name:v('#a_name'),email:em,password:pw});Store.set('asp_users',users);user={name:v('#a_name'),email:em};toast('Account created');}
  else{const u=users.find(u=>u.email===em&&u.password===pw);if(!u){$('#e_form').textContent='Incorrect email or password. Create an account if you are new.';return}user={name:u.name,email:u.email};toast('Logged in');}
  Store.set('asp_user',user);location.hash='#/app/dashboard'}
/* ===== Events ===== */
const cur=()=>location.hash.replace('#/app/','')||'dashboard';
const rerender=()=>{save();render()};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(el.tagName==='A'&&el.getAttribute('href'))e.preventDefault();
  if(a==='go')return go(el.dataset.to);
  if(a==='sc'){const t=el.dataset.to;if(location.hash&&location.hash!=='#/'){location.hash='#/'}setTimeout(()=>document.getElementById(t)?.scrollIntoView({behavior:'smooth'}),60);return}
  if(a==='tmenu')return $('#tnav').classList.toggle('open');
  if(a==='sidemenu')return $('#side').classList.toggle('open');
  if(a==='logout'){user=null;Store.set('asp_user',null);toast('Logged out');return go('home')}
  if(a==='forgot')return toast('Password reset is not available in this demo');
  if(a==='gen'){if(!S.subjects.length)return toast('Add a subject first');const b=el;b.innerHTML='<span class="spin"></span> Generating';setTimeout(()=>{S.plan=Planner.generate();if(!S.plan)toast('All exams have passed. Add a new exam date.');else toast('Study plan generated');rerender()},600);return}
  if(a==='addsub')return form('Add Subject',subFields,{difficulty:'Medium',priority:2,exam:dayStr(14),topics:10,done:0},o=>{S.subjects.push({id:uid(),...o});toast('Subject added');rerender()});
  if(a==='editsub'){const s=S.subjects.find(x=>x.id===id);return form('Edit Subject',subFields,s,o=>{Object.assign(s,o);toast('Subject updated');rerender()})}
  if(a==='delsub')return confirmBox('This deletes the subject and its tasks.',()=>{S.subjects=S.subjects.filter(x=>x.id!==id);S.tasks=S.tasks.filter(t=>t.subjectId!==id);S.plan=null;toast('Subject deleted');rerender()});
  if(a==='topic'){const s=S.subjects.find(x=>x.id===id);if(s.done>=s.topics)return toast('All topics already completed');s.done++;toast('Progress updated');return rerender()}
  if(a==='addtask'){if(!S.subjects.length)return toast('Add a subject first');return form('Add Task',taskFields(),{subjectId:S.subjects[0].id,deadline:dayStr(3)},o=>{S.tasks.push({id:uid(),done:false,...o});toast('Task added');rerender()})}
  if(a==='edittask'){const t=S.tasks.find(x=>x.id===id);return form('Edit Task',taskFields(),t,o=>{Object.assign(t,o);toast('Task updated');rerender()})}
  if(a==='deltask')return confirmBox('This deletes the task.',()=>{S.tasks=S.tasks.filter(x=>x.id!==id);toast('Task deleted');rerender()});
  if(a==='tdone'){const t=S.tasks.find(x=>x.id===id);t.done=el.checked;toast(t.done?'Task completed':'Task reopened');return rerender()}
  if(a==='sess'){S.plan[el.dataset.d].items[el.dataset.i].done=el.checked;return rerender()}
  if(a==='rem'){S.rem[el.dataset.k]=el.checked;toast(el.checked?'Reminder enabled':'Reminder disabled');return rerender()}
  if(a==='theme'){const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#12132a';r.dataset.theme=dark?'light':'dark';return}
  if(a==='reset')return confirmBox('This restores the demo data and removes your changes.',()=>{S=seed();aiOut=null;toast('Demo data restored');rerender()});
  if(a==='ai'){$('#aiout').innerHTML='<div class="card"><span class="spin"></span> Analysing your data…</div>';
    AI.recommend(el.dataset.k).then(r=>{aiOut=r;$('#aiout').innerHTML=aiCards(r);save()}).catch(()=>{$('#aiout').innerHTML='<div class="empty">Could not generate recommendations. Please try again.</div>'})}
});
document.addEventListener('change',e=>{if(e.target.dataset.act==='hrs'){const v=+e.target.value;if(!(v>=1&&v<=7)){e.target.value=S.hours;return toast('Enter 1 to 7 hours')}S.hours=v;S.plan=Planner.generate();toast('Plan updated for '+v+' hrs/day');rerender()}});
render();
</script></body></html>
